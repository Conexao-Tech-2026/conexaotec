services:
  nginx:
    image: nginx:latest
    volumes:
      - ./arquivos/nginx/conf.d:/etc/nginx/conf.d
      - ./arquivos/nginx/certs/server.crt:/etc/ssl/certs/server.crt
      - ./arquivos/nginx/certs/server.key:/etc/ssl/certs/server.key
    ports:
      - 80:80
      - 443:443
    networks:
      - frontend

  node:
    build: ./arquivos/node_app/
    networks:
      - frontend
  python:
    build: ./arquivos/python_app/
    networks:
      - frontend
  
networks:
  frontend:
    driver: bridge
