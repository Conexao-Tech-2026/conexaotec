server {
	listen 80; #Define a porta de conexão IPV4
	listen [::]:80; #Define a porta de conexão IPV6

	server_name node.conexaotec.com; #Compara o campo do request header host:

	location / { #Compara a URI da requisição
		return 301 https://$host$request_uri; #Redireciona o usuário para HTTPS://
	}
}

server {
	listen 443 ssl; #Define a porta e ativa o SSL para IPV4
	listen [::]:443 ssl; #Define a porta e ativa o SSL para IPV6

	server_name node.conexaotec.com; # Compara o campo do request header host:
	
	ssl_certificate /etc/ssl/certs/server.crt; # Aponta para o arquivo do certificado
  ssl_certificate_key /etc/ssl/certs/server.key; # Aponta para a chave do certificado

  location / { # Compara a URI da requisição
			
		proxy_pass http://node:3000; # Encaminha as requisições para o serviço Node.js na porta 3000, acessível pelo nome node
     
		proxy_set_header Host $host; # Preserva o domínio original solicitado pelo cliente no cabeçalho Host
    proxy_set_header X-Real-IP $remote_addr; # Envia o endereço IP do cliente conectado diretamente ao Nginx
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Encaminha a cadeia de IPs dos proxies e acrescenta o IP do cliente
		proxy_set_header X-Forwarded-Proto $scheme; # Informa à aplicação o protocolo utilizado pelo cliente na conexão com o Nginx (HTTP ou HTTPS)
	}
}
