
# Define o usuário do sistema operacional utilizado pelos processos de trabalho do Nginx
user nginx;

# Define automaticamente a quantidade de processos de trabalho conforme os núcleos disponíveis da CPU
worker_processes auto;

# Define o arquivo de log de erros e o nível mínimo de mensagens registradas (notice)
error_log /var/log/nginx/error.log notice;

# Define o arquivo que armazena o PID do processo principal do Nginx
pid /run/nginx.pid;


# Configura os parâmetros de conexão dos processos de trabalho
events {
    # Define o número máximo de conexões simultâneas que cada worker pode manter
    worker_connections 1024;
}


# Inicia o contexto de configuração do servidor HTTP
http {
    # Carrega os tipos MIME utilizados para identificar o tipo de conteúdo dos arquivos
    include /etc/nginx/mime.types;

    # Define o tipo MIME padrão para conteúdos sem um tipo identificado
    default_type application/octet-stream;


    # Define o formato dos registros de acesso HTTP
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Ativa o registro das requisições no arquivo de log de acesso utilizando o formato main
    access_log /var/log/nginx/access.log main;


    # Habilita o envio eficiente de arquivos utilizando recursos do sistema operacional
    sendfile on;

    #tcp_nopush on;
    # Quando habilitada, otimiza o envio de cabeçalhos e conteúdo em conjunto
    # em conexões que utilizam sendfile, podendo melhorar a eficiência da transmissão


    # Define o tempo máximo de espera por novas requisições em uma conexão persistente
    keepalive_timeout 65;


    #gzip on;
    # Quando habilitada, permite comprimir as respostas HTTP para reduzir o volume de dados
    # transmitidos ao cliente, desde que o conteúdo seja elegível para compressão


    # Inclui os arquivos de configuração adicionais existentes no diretório conf.d
    # O caractere * permite carregar todos os arquivos que correspondam ao padrão informado
    include /etc/nginx/conf.d/*.conf;
}
