services:
  nginx:
    image: nginx:latest
    volumes:
      - ./arquivos/nginx_files/nginx/:/etc/nginx/
      - ./arquivos/nginx_files/certs/server.crt:/etc/ssl/certs/server.crt
      - ./arquivos/nginx_files/certs/server.key:/etc/ssl/certs/server.key
    ports:
      - 80:80
      - 443:443
    networks:
      - frontend
    depends_on:
      - node
      - python
  node:
    build: ./arquivos/node_app/
    networks:
      - frontend
  python:
    build: ./arquivos/python_app/
    networks:
      - frontend
  
networks:
  frontend:
    driver: bridge
